<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Scales</title>
  <style>
    .key {
      display: inline-block;
      width: 40px;
      height: 150px;
      border: 1px solid black;
      margin: 0 2px;
      position: relative;
    }
    .key.white {
      background: white;
    }
    .key.black {
      background: black;
      width: 30px;
      height: 100px;
      position: absolute;
      margin-left: -15px;
      z-index: 1;
    }
    .key.highlight {
      background: yellow;
    }
    #piano-container {
      position: relative;
      height: 150px;
    }
  </style>
</head>
<body>
  <div id="piano-container"></div>
  <select id="scale-selector">
    <option value="">Select a scale</option>
  </select>
  <div id="selected-notes"></div>
  <script type="module" src="./index.js"></script>
</body>
</html>
